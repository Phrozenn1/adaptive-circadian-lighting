apply_now:
  name: Apply Now
  description: Immediately calculate and apply adaptive lighting settings to lights.
  fields:
    entity_id:
      name: Target Entity
      description: Optional specific light or circadian switch to apply settings to (applies to all if omitted).
      selector:
        entity:

reset_manual_override:
  name: Reset Manual Override
  description: Reset manual overrides and resume automatic adaptive control.
  fields:
    entity_id:
      name: Target Entity
      description: Specific light or circadian switch to reset (resets all if omitted).
      selector:
        entity:

set_profile:
  name: Set Profile
  description: Activate a lighting profile (e.g. Normal, Sleep, Morning, Evening, Focus, Relax).
  fields:
    profile:
      name: Profile
      description: The profile name to activate.
      required: true
      selector:
        select:
          options:
            - normal
            - sleep
            - morning
            - evening
            - focus
            - relax
    entity_id:
      name: Target Entity
      description: Optional specific light, switch or select entity to apply profile to (applies to all if omitted).
      selector:
        entity:

toggle_sleep_mode:
  name: Toggle Sleep Mode
  description: Toggle sleep mode on or off.
  fields:
    entity_id:
      name: Target Entity
      description: Optional specific light or circadian switch to toggle sleep for (toggles all if omitted).
      selector:
        entity:
