<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(48, 56) scale(0.78)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
    <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
    <circle cx="200" cy="200" r="88" fill="url(#sunGrad)" opacity="0.25" filter="url(#glow)" />
    <circle cx="200" cy="200" r="68" fill="url(#sunGrad)" />
    <g stroke="url(#sunGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85">
      <line x1="200" y1="96" x2="200" y2="114" />
      <line x1="126" y1="126" x2="139" y2="139" />
      <line x1="96" y1="200" x2="114" y2="200" />
      <line x1="126" y1="274" x2="139" y2="261" />
    </g>
    <path d="M 270 145 A 72 72 0 1 1 205 270 A 58 58 0 1 0 270 145 Z" fill="url(#moonGrad)" opacity="0.9" filter="url(#glow)" />
    <path d="M 50 350 C 130 350, 150 250, 220 250 C 290 250, 310 390, 380 390 C 420 390, 440 360, 462 340"
          fill="none" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
    <circle cx="220" cy="250" r="10" fill="#fde047" />
    <circle cx="380" cy="390" r="10" fill="#38bdf8" />
  </g>

  <!-- Right Typography -->
  <text x="490" y="225" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1">Adaptive</text>
  <text x="490" y="300" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="64" fill="#38bdf8" letter-spacing="-1">Circadian</text>
  <text x="495" y="365" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="30" fill="#94a3b8" letter-spacing="4">LIGHTING FOR HOME ASSISTANT</text>
</svg>
